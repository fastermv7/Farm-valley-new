<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#203d32">
<meta name="description" content="Ekin eking, hayvon boqing va vodiyda o‘z fermangizni quring.">
<title>Farm Valley</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<style>:root{color-scheme:light;--ink:#253d30;--paper:#fff4d7;--line:#ddcba3;--gold:#ffd373;--green:#3d674c;font-family:system-ui,Segoe UI,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#24493c;color:var(--ink);overscroll-behavior:none}
[hidden]{display:none!important}
button{font:inherit;cursor:pointer;touch-action:manipulation;color:inherit}
button:focus-visible{outline:3px solid #167ec7;outline-offset:2px}
button:disabled{cursor:default;opacity:.57}
#game{position:relative;width:100%;height:100%;height:100dvh;overflow:hidden;isolation:isolate;background:#89a757}
#map{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
#map:active{cursor:grabbing}
.hud{position:absolute;top:max(12px,env(safe-area-inset-top));left:max(14px,env(safe-area-inset-left));right:max(14px,env(safe-area-inset-right));display:flex;align-items:center;justify-content:space-between;gap:9px;pointer-events:none}
.hud>*{pointer-events:auto}
.brand,.resources,.square,.lesson,.dock,.build-hint,#panel{background:var(--paper);border:1px solid #f9edcf;box-shadow:0 4px 0 #664d3270,0 6px 18px #263b2b36}
.brand{display:flex;align-items:center;gap:8px;padding:5px 13px 5px 5px;border-radius:14px}
.brand img{width:36px;height:36px}
.brand strong{font:bold clamp(18px,3.5vw,27px) Georgia,serif;white-space:nowrap;letter-spacing:-.65px}
.brand em{color:#557845}
.resources{display:flex;align-items:center;gap:8px;border-radius:14px;padding:5px 9px 5px 5px}
.level{height:35px;width:35px;border-radius:10px;display:grid;place-items:center;background:#49795e;color:white;font-weight:900;box-shadow:inset 0 -3px #2d533c}
.xp{min-width:64px;font-size:12px;font-variant-numeric:tabular-nums}
.xp div{height:6px;background:#e2d7b7;border-radius:6px;margin-top:2px;overflow:hidden}
.xp i{display:block;height:100%;background:#71a957;border-radius:6px}
.coin{border-left:1px solid #d7c5a1;display:flex;align-items:center;gap:5px;padding-left:8px;font-variant-numeric:tabular-nums}
.gold{width:17px;height:17px;border-radius:50%;background:#f5bd4b;border:2px solid #d8922e;box-shadow:inset 0 0 0 2px #ffda77;display:inline-block;vertical-align:middle}
.square{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:25px;line-height:1;padding:0}
.square svg{width:22px;height:22px}
.lesson{position:absolute;top:max(69px,calc(env(safe-area-inset-top) + 56px));left:max(14px,env(safe-area-inset-left));width:max-content;max-width:min(270px,58vw);border-radius:13px;padding:8px 11px;font-size:13px;display:flex;align-items:center;gap:9px}
.lesson div{line-height:1.28}
.lesson b{display:block;color:#4b744d;font-size:12px;margin-bottom:2px}
.lesson button{border:0;background:#eadcb9;border-radius:8px;width:32px;height:32px;flex:none;font-size:19px}
.map-actions{position:absolute;right:max(14px,env(safe-area-inset-right));bottom:max(18px,env(safe-area-inset-bottom));display:grid;gap:7px}
.dock{position:absolute;left:50%;bottom:max(13px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:4px;padding:4px;border-radius:17px}
.dock button{min-width:76px;min-height:54px;display:grid;justify-items:center;align-content:center;gap:1px;border:0;background:transparent;font-size:12px;font-weight:800;border-radius:12px;padding:3px 6px}
.dock button:hover,.dock button[aria-current=true]{background:#eadab2}
.dock svg{width:27px;height:27px}
#panel{position:absolute;top:max(66px,calc(env(safe-area-inset-top) + 54px));bottom:max(82px,calc(env(safe-area-inset-bottom) + 73px));right:max(14px,env(safe-area-inset-right));width:min(340px,calc(100% - 28px));border-radius:17px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 6px 0 #5a47295c,0 10px 28px #28362265}
.panel-top{display:flex;align-items:center;justify-content:space-between;padding:3px 8px 3px 14px;border-bottom:1px solid var(--line);background:#f0dfb9}
.panel-top h1{font:bold 22px Georgia,serif;margin:0}
.panel-top .square{background:transparent;box-shadow:none;border:0;width:44px;height:39px}
.panel-body{overflow:auto;overscroll-behavior:contain;padding:9px 10px;scrollbar-color:#b5a777 #f9edce;font-size:14px}
.panel-body p{margin:0 0 8px;line-height:1.42}
.list-row{display:flex;align-items:center;gap:8px;min-height:48px;padding:5px 6px;margin-bottom:5px;border:1px solid #ead9b4;border-radius:10px;background:#fff9e7}
.list-row:last-child{margin-bottom:0}
.list-row svg{width:29px;height:29px;flex:none}
.list-row .detail{min-width:0;flex:1}
.list-row small{display:block;color:#55664c;font-size:12px;line-height:1.3}
.action{border:0;background:var(--green);color:#fff9e7;border-radius:8px;min-height:40px;padding:5px 9px;font-weight:750;box-shadow:inset 0 -3px #284936;flex:none}
.action.secondary{background:#eddab0;color:var(--ink);box-shadow:inset 0 -3px #cdb788}
.panel-body h2{font-size:13px;margin:11px 0 5px;color:#526646}
.build-hint{position:absolute;left:50%;transform:translateX(-50%);bottom:max(85px,calc(env(safe-area-inset-bottom) + 70px));width:max-content;max-width:93%;border-radius:10px;padding:5px 7px 5px 10px;font-size:13px;display:flex;align-items:center;gap:9px}
.build-hint button{min-height:34px;background:#ead5ac;border:0;border-radius:7px;font-weight:700}
#notice{position:absolute;pointer-events:none;top:58px;left:50%;transform:translateX(-50%);text-align:center;max-width:90%;width:max-content;font-size:13px;font-weight:700;z-index:4}
#notice:not(:empty){background:#244b38;color:#fff8e4;padding:7px 12px;border-radius:9px;box-shadow:0 3px 8px #253b3a44}
@media(max-width:540px){.brand strong{font-size:18px}.brand{padding-right:7px}.brand img{width:30px;height:30px}.hud{left:7px;right:7px}.resources{gap:5px}.xp{min-width:54px}.dock button{min-width:66px}.map-actions{right:8px;bottom:88px}.lesson{left:8px}.square{width:42px;height:42px}}
@media(orientation:landscape) and (max-height:420px){.hud{top:max(6px,env(safe-area-inset-top))}.brand img{width:30px;height:30px}.resources{padding-block:3px}.lesson{top:54px}.dock{bottom:max(7px,env(safe-area-inset-bottom))}.dock button{min-height:47px}.dock svg{width:23px;height:23px}.map-actions{bottom:10px}.map-actions .square{height:41px}.build-hint{bottom:69px}#panel{top:54px;bottom:66px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
.hud>.square{flex:0 0 44px}
@media(max-width:540px){
  .hud{gap:6px}
  .hud>.square{flex-basis:42px}
  .brand{gap:5px;padding-right:7px}
  .brand strong{font-size:16px}
  .brand img{width:26px;height:26px}
  .resources{padding-inline:4px}
  .level{width:30px;height:30px}
  .xp{min-width:44px;font-size:11px}
  .coin{padding-left:4px}
  .gold{width:14px;height:14px}
}
@media(max-width:335px){
  .brand img{display:none}
  .brand{padding-left:7px;min-height:36px}
}

.editor-top,.editor-bar,.preview-back{position:absolute;background:var(--paper);border:1px solid #f9edcf;border-radius:14px;box-shadow:0 4px 0 #664d3270,0 6px 18px #263b2b36}
.editor-top{top:max(8px,env(safe-area-inset-top));left:max(8px,env(safe-area-inset-left));display:flex;gap:10px;align-items:center;padding:4px 12px 4px 4px}
.editor-top strong{font:700 clamp(16px,4vw,21px) Georgia,serif}
.editor-bar{left:max(8px,env(safe-area-inset-left));right:max(8px,env(safe-area-inset-right));bottom:max(8px,env(safe-area-inset-bottom));max-width:860px;margin-inline:auto;padding:5px 7px;display:grid;gap:3px}
.editor-bar button,.editor-top button,.preview-back,.editor-variant select{min-height:42px;border:1px solid #d9c79e;border-radius:8px;background:#fff9e7;padding:3px 8px;font-size:12px;font-weight:750}
.editor-bar button[aria-pressed=true],.editor-bar .primary{background:var(--green);color:#fff9e7;border-color:#365842}
.editor-status{display:flex;gap:4px;align-items:center;font-size:12px;min-height:21px}
.editor-status span{flex:1;color:#465d46}
.editor-status button{min-height:36px}
.editor-tools,.editor-actions{display:flex;gap:4px;overflow-x:auto;overscroll-behavior-inline:contain;padding-bottom:3px;scrollbar-width:thin}
.editor-tools button,.editor-actions button{flex:none;white-space:nowrap}
.editor-variant{display:flex;align-items:center;gap:8px;font-size:12px}
.editor-variant select{min-height:36px;max-width:75%;color:var(--ink)}
.preview-back{top:max(12px,env(safe-area-inset-top));left:max(12px,env(safe-area-inset-left))}
#game.editing .hud,#game.editing .dock,#game.editing #lesson,#game.editing #buildHint{display:none}
#game.editing .map-actions{top:max(8px,env(safe-area-inset-top));bottom:auto;right:max(8px,env(safe-area-inset-right))}
#game.editing .map-actions .square{width:40px;height:40px}
#game.editing.previewing .map-actions{display:none}
#game.editing #panel{top:max(62px,calc(env(safe-area-inset-top) + 53px));bottom:max(8px,env(safe-area-inset-bottom))}
#game.editing #notice{top:max(56px,calc(env(safe-area-inset-top) + 49px))}
.draft-form{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.draft-form input{min-width:0;flex:1;min-height:42px;border:1px solid #d9c79e;border-radius:8px;background:#fff9e7;padding:6px 8px;font:inherit}
.draft-buttons{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
@media(orientation:portrait){
  .dock{width:calc(100% - 16px);max-width:380px;bottom:max(9px,env(safe-area-inset-bottom))}
  .dock button{min-width:0;flex:1}
  .map-actions{bottom:max(85px,calc(env(safe-area-inset-bottom) + 72px))}
  #panel{left:max(8px,env(safe-area-inset-left));right:max(8px,env(safe-area-inset-right));width:auto;top:auto;max-height:64%;bottom:max(76px,calc(env(safe-area-inset-bottom) + 67px))}
  #game.editing #panel{max-height:none}
  .editor-tools{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:3px}
  .editor-tools button{white-space:normal;min-width:0;padding-inline:2px;line-height:1.05;overflow-wrap:anywhere}
  .editor-actions{flex-wrap:wrap;overflow:visible}
  .editor-actions button{flex:1}
}
@media(orientation:landscape) and (max-height:420px){
  #game.editing .map-actions{display:flex}
  .editor-bar button{min-height:35px}
  .editor-variant select{min-height:32px}
}
@media(max-width:350px){
  .brand strong{font-size:15px}
  .editor-tools{grid-template-columns:repeat(4,minmax(0,1fr))}
}
.draft-row-actions{display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end}
.list-row .detail{overflow-wrap:anywhere}
@media(max-width:380px){.draft-row-actions{max-width:80px}.draft-row-actions button{width:100%}}
dialog{max-width:min(92vw,460px);max-height:80dvh;overflow:auto;border:2px solid #8c9472;border-radius:14px;background:#fff6de;color:#304331;padding:18px}dialog label{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:6px 0}dialog input[type=number]{width:6em;padding:6px}dialog button,.pause button{padding:9px 12px;border-radius:9px;background:#355d43;color:white;border:0;margin:4px}dialog pre{white-space:pre-wrap}.pause{margin:20vh auto;text-align:center;background:#fff2d1;padding:20px}
</style>
</head>
<body>
<main id="game" aria-label="Farm Valley">
<canvas id="map" aria-label="Ferma xaritasi"></canvas>
<header class="hud">
  <div class="brand"><img src="/icon.svg" alt=""><strong>Farm <em>Valley</em></strong></div>
  <div class="resources">
    <div class="level" id="level" aria-label="Daraja"></div>
    <div class="xp"><b id="xp"></b><div><i id="bar"></i></div></div>
    <div class="coin"><span class="gold"></span><b id="coins"></b></div>
  </div>
  <button id="settings" class="square" aria-label="Sozlamalar" title="Sozlamalar"></button>
</header>
<div id="lesson" class="lesson"></div>
<div id="buildHint" class="build-hint" hidden><span id="placementText"></span><button id="cancel">Bekor qilish</button></div>
<div id="notice" role="status"></div>
<div class="map-actions" aria-label="Xaritani boshqarish">
  <button id="plus" class="square" aria-label="Kattalashtirish">+</button>
  <button id="minus" class="square" aria-label="Kichraytirish">−</button>
  <button id="home" class="square" aria-label="Ferma markaziga qaytish"></button>
</div>
<nav class="dock" aria-label="Ferma menyusi">
  <button data-view="fields" data-icon="wheat">Dala</button>
  <button data-view="orders" data-icon="orders">Buyurtmalar</button>
  <button data-view="barn" data-icon="barn">Ombor</button>
  <button data-view="shop" data-icon="shop">Do‘kon</button>
</nav>
<div id="editorTop" class="editor-top" hidden>
  <button id="editorBack">Chiqish</button><strong>Xarita muharriri</strong>
</div>
<section id="editorBar" class="editor-bar" aria-label="Xarita muharriri" hidden></section>
<button id="previewBack" class="preview-back" hidden>Muharrirga qaytish</button>
<input id="jsonFile" type="file" accept=".json,application/json" hidden>
<aside id="panel" hidden aria-labelledby="panelTitle">
  <div class="panel-top"><h1 id="panelTitle"></h1><button id="close" class="square" aria-label="Yopish">×</button></div>
  <div id="panelBody" class="panel-body"></div>
</aside>
</main>
<script>const ADMIN_VIEW=true;
'use strict';

const FarmData = (() => {
  const crops = {
    wheat: { name: 'Bug‘doy', duration: 12, level: 1, sale: 3 },
    corn: { name: 'Makkajo‘xori', duration: 25, level: 2, sale: 5 },
    carrot: { name: 'Sabzi', duration: 40, level: 3, sale: 7 },
    pumpkin: { name: 'Qovoq', duration: 60, level: 4, sale: 10 }
  };
  const items = {
    ...crops, flour: { name: 'Un', sale: 6 }, egg: { name: 'Tuxum', sale: 8 }, milk: { name: 'Sut', sale: 13 },
    wool: { name: 'Jun', sale: 17 }, bread: { name: 'Non', sale: 12 },
    feed: { name: 'Yem', sale: 4 }
  };
  const buildings = {
    field: { name: 'Dala', price: 15, level: 1, description: 'Ekin ekish uchun yer' },
    chicken: { name: 'Tovuqxona', price: 65, level: 1, recipe: { feed: 1 }, output: 'egg', count: 2, duration: 25 },
    bakery: { name: 'Nonvoyxona', price: 75, level: 1, recipe: { flour: 1 }, output: 'bread', count: 1, duration: 20 },
    windmill: { name: 'Un tegirmoni', price: 95, level: 1, recipe: { wheat: 2 }, output: 'flour', count: 1, duration: 22 },
    mill: { name: 'Yem tegirmoni', price: 85, level: 1, recipe: { wheat: 1 }, output: 'feed', count: 3, duration: 18 },
    cow: { name: 'Molxona', price: 95, level: 2, recipe: { feed: 1 }, output: 'milk', count: 2, duration: 40 },
    sheep: { name: 'Qo‘yxona', price: 130, level: 3, recipe: { feed: 1 }, output: 'wool', count: 2, duration: 55 },
    flowers: { name: 'Gulzor', price: 18, level: 1, description: 'Ferma bezagi' },
    tree: { name: 'Mevali daraxt', price: 25, level: 1, description: 'Ferma bezagi' },
    fence: { name: 'Yog‘och panjara', price: 12, level: 1, description: 'Ferma bezagi' }
  };
  const orders = [
    { id: 'tea', name: 'Choyxona', need: { wheat: 3 }, coins: 24, xp: 10, level: 1 },
    { id: 'breakfast', name: 'Nonushta', need: { egg: 2, bread: 1 }, coins: 42, xp: 14, level: 1 },
    { id: 'market', name: 'Bozor savati', need: { corn: 3, wheat: 1 }, coins: 44, xp: 16, level: 2 },
    { id: 'dairy', name: 'Sut do‘koni', need: { milk: 2, bread: 1 }, coins: 58, xp: 18, level: 2 },
    { id: 'garden', name: 'Sabzavot savati', need: { carrot: 3, corn: 2 }, coins: 65, xp: 21, level: 3 },
    { id: 'weaver', name: 'To‘quvchi', need: { wool: 2 }, coins: 67, xp: 23, level: 3 },
    { id: 'autumn', name: 'Kuzgi bozor', need: { pumpkin: 3, carrot: 1 }, coins: 90, xp: 30, level: 4 }
  ];
  const expansions = [
    { name: 'Sharqiy yaylov', price: 100, level: 2, x: 11, y: 4 },
    { name: 'Janubiy bog‘', price: 170, level: 3, x: 5, y: 11 }
  ];
  const initialObjects = [
    ...[4, 5].flatMap(y => [3, 4, 5].map(x => ({ kind: 'field', x, y }))),
    { kind: 'house', x: 4, y: 2 }, { kind: 'bakery', x: 7, y: 4 },
    { kind: 'mill', x: 8, y: 3 }, { kind: 'chicken', x: 8, y: 6 },
    { kind: 'barn', x: 3, y: 8 }, { kind: 'orders', x: 6, y: 8 },
    { kind: 'flowers', x: 2, y: 3 }, { kind: 'fence', x: 4, y: 8 },
    {kind:'windmill',x:2,y:6}, {kind:'cow',x:9,y:5}, {kind:'sheep',x:7,y:8}
  ];
  function zone(x, y) {
    if (x >= 10 && x <= 13 && y >= 2 && y <= 9) return 1;
    if (x >= 2 && x <= 9 && y >= 10 && y <= 13) return 2;
    return x >= 2 && x <= 9 && y >= 2 && y <= 9 ? 0 : -1;
  }
  function path(x, y) {
    return (y === 7 && x >= 2 && x <= 9) || (x === 6 && y >= 2 && y <= 7)
      || (y === 3 && x >= 4 && x <= 8);
  }
  const caps = { house:10, barn:11, chicken:5, sheep:5, cow:5, bakery:5, windmill:10, mill:10 };
  const plots = [6,8,10,13,16,20,24,29,34,40];
  return { caps, plots, crops, items, buildings, orders, expansions, initialObjects, zone, path };
})();

'use strict';

const FarmWorld = (() => {
  const min = 0;
  const max = 47;
  const key = (x, y) => x + ',' + y;
  const inBounds = (x, y) => Number.isInteger(x) && Number.isInteger(y) &&
    x >= min && y >= min && x <= max && y <= max;
  const validKey = value => {
    if (typeof value !== 'string' || !/^\d{1,2},\d{1,2}$/.test(value)) return false;
    const [x, y] = value.split(',').map(Number);
    return inBounds(x, y) && key(x, y) === value;
  };
  const kinds = Object.freeze({
    ...Object.fromEntries(Object.entries(FarmData.buildings).map(([id, building]) => [id, building.name])),
    house: 'Ferma uyi', barn: 'Ombor', orders: 'Buyurtmalar taxtasi', rock: 'Tosh'
  });
  const essential = new Set(['house', 'barn', 'orders']);
  const empty = () => ({ tiles: {}, areas: [] });
  const clone = value => JSON.parse(JSON.stringify(value));
  const record = value => value && typeof value === 'object' && !Array.isArray(value);
  const ordered = value => Object.fromEntries(Object.entries(value).sort(([a], [b]) => a.localeCompare(b)));

  function parse(value) {
    if (!record(value) || !record(value.tiles) || !Array.isArray(value.areas)) throw Error('Xarita formati xato.');
    const tiles = {};
    for (const [cell, type] of Object.entries(value.tiles)) {
      if (!validKey(cell) || !['grass', 'road', 'water'].includes(type)) throw Error('Xaritada yaroqsiz katak bor.');
      tiles[cell] = type;
    }
    if (value.areas.length > (max + 1) ** 2 || !value.areas.every(validKey)) throw Error('Yangi hudud koordinatasi xato.');
    return { tiles: ordered(tiles), areas: [...new Set(value.areas)].sort() };
  }

  function wild(x,y){
    const lake=((x-28)/7)**2+((y-19)/5)**2 < 1;
    const channel=x>=30 && Math.abs(y-(19+Math.sin(x*.31)*2))<1.4;
    return lake || channel ? 'water' : 'grass';
  }
  const ground = (map,x,y) => map.tiles[key(x,y)] || (FarmData.path(x,y)?'road':wild(x,y));
  const areaIndex = new WeakMap();
  function containsArea(areas,cell){
    let set=areaIndex.get(areas);
    if(!set || set.size!==areas.length){set=new Set(areas);areaIndex.set(areas,set);}
    return set.has(cell);
  }
  const open = (map, zones, x, y) => inBounds(x, y) &&
    (Boolean(zones[FarmData.zone(x, y)]) || containsArea(map.areas,key(x, y)));
  const buildable = (map, zones, x, y) => open(map, zones, x, y) && ground(map, x, y) === 'grass';

  function layout(state) {
    return state.objects.map(({ id, kind, x, y }) => ({ id, kind, x, y })).sort((a, b) => a.id - b.id);
  }
  function fingerprint(state) {
    return JSON.stringify([parse(state.landscape), layout(state)]);
  }
  function draft(state) {
    return { format: 'farm-valley-map', version: 1, base: fingerprint(state),
      landscape: clone(state.landscape), objects: layout(state) };
  }
  function parseDraft(value) {
    if (value?.format !== 'farm-valley-map' || value.version !== 1 ||
        typeof value.base !== 'string' || value.base.length > 250000 ||
        !Array.isArray(value.objects) || value.objects.length > (max + 1) ** 2) {
      throw Error('Farm Valley xarita fayli kerak.');
    }
    const landscape = parse(value.landscape);
    const ids = new Set();
    const cells = new Set();
    const objects = value.objects.map(o => {
      if (!record(o) || !Number.isSafeInteger(o.id) || !o.id || !Object.hasOwn(kinds, o.kind) ||
          !inBounds(o.x, o.y) || ids.has(o.id) || cells.has(key(o.x, o.y))) {
        throw Error('Xaritada noma’lum obyekt yoki ustma-ust joylashgan katak bor.');
      }
      ids.add(o.id);
      cells.add(key(o.x, o.y));
      return { id: o.id, kind: o.kind, x: o.x, y: o.y };
    });
    return { format: value.format, version: 1, base: value.base, landscape, objects };
  }
  function checkDraft(map, state) {
    if (map.base !== fingerprint(state)) map = mergeDraft(map, state);
    const live = new Map(state.objects.map(o => [o.id, o]));
    const kept = new Set(map.objects.map(o => o.id));
    if (!map.objects.some(o => o.kind === 'field')) throw Error('Fermada kamida bitta dala qolishi kerak.');
    for (const old of state.objects) {
      if (!kept.has(old.id) && (essential.has(old.kind) || old.ready || old.crop)) {
        throw Error(kinds[old.kind] + ' ishlayotgani yoki ferma uchun zarurligi sababli o‘chirilmaydi.');
      }
    }
    for (const o of map.objects) {
      const old = live.get(o.id);
      if ((o.id > 0 && old?.kind !== o.kind) || (o.id < 0 && essential.has(o.kind))) {
        throw Error('Xaritada saqlangan fermaga mos kelmaydigan obyekt bor.');
      }
      const samePlace = old?.x === o.x && old.y === o.y;
      if (samePlace && ground(map.landscape, o.x, o.y) === ground(state.landscape, o.x, o.y) &&
          open(map.landscape, state.zones, o.x, o.y)) continue;
      if (!buildable(map.landscape, state.zones, o.x, o.y)) {
        throw Error(kinds[o.kind] + ' ochiq va quruq katakda joylashishi kerak.');
      }
    }
    return map;
  }

  function mergeDraft(map, state) {
    let base;
    try {
      const [landscape, objects] = JSON.parse(map.base);
      base = parseDraft({ ...map, landscape, objects });
      if (base.objects.some(o => o.id < 1)) throw Error();
    } catch { throw Error('Qoralamaning boshlang‘ich xaritasi yaroqsiz.'); }
    const conflict = () => Error('Qoralama va joriy ferma bir joyda o‘zgargan. Joylashuvni tekshiring yoki yangi qoralama oching.');
    const landscape = clone(state.landscape);
    const baseObjects = new Map(base.objects.map(o => [o.id, o]));
    const edited = new Map(map.objects.map(o => [o.id, o]));
    const current = new Map(layout(state).map(o => [o.id, o]));
    const same = (a, b) => a === b || (a && b && a.kind === b.kind && a.x === b.x && a.y === b.y);
    for (const [id, old] of baseObjects) {
      const next = edited.get(id);
      const live = current.get(id);
      if (same(next, old) || same(next, live)) continue;
      if (!same(live, old)) throw conflict();
      if (next) current.set(id, next);
      else current.delete(id);
    }
    for (const [id, next] of edited) {
      if (id < 0) current.set(id, next);
      else if (!baseObjects.has(id)) throw conflict();
    }
    for (const cell of new Set([...Object.keys(base.landscape.tiles), ...Object.keys(map.landscape.tiles)])) {
      const old = base.landscape.tiles[cell];
      const next = map.landscape.tiles[cell];
      const live = landscape.tiles[cell];
      if (next === old || next === live) continue;
      if (live !== old) throw conflict();
      if (next) landscape.tiles[cell] = next;
      else delete landscape.tiles[cell];
    }
    const areas = new Set(landscape.areas);
    for (const cell of base.landscape.areas) if (!map.landscape.areas.includes(cell)) areas.delete(cell);
    for (const cell of map.landscape.areas) if (!base.landscape.areas.includes(cell)) areas.add(cell);
    landscape.areas = [...areas];
    return parseDraft({ ...map, base: fingerprint(state), landscape, objects: [...current.values()] });
  }

  return { min, max, key, inBounds, kinds, essential, empty, clone, record, parse, ground, open,
    wild, buildable, draft, parseDraft, checkDraft };
})();

'use strict';

const FarmSave = (() => {
  const KEY = 'farm-valley-save-v1';
  const PREVIOUS = 'farm-valley-save-v2-previous';
  const safeInt = value => Number.isSafeInteger(value) && value >= 0;
  const positive = value => Number.isSafeInteger(value) && value > 0;

  function parse(value) {
    if (!FarmWorld.record(value) || ![1, 2, 3].includes(value.version) || !safeInt(value.coins) ||
        !safeInt(value.xp) || !positive(value.nextId) || !Array.isArray(value.objects) ||
        !FarmWorld.record(value.inventory) || !FarmWorld.record(value.orderReady) ||
        !Array.isArray(value.zones) || value.zones.length !== 3 || value.zones[0] !== true ||
        !value.zones.every(flag => typeof flag === 'boolean') ||
        !safeInt(value.lesson) || value.lesson > 4 || typeof value.sound !== 'boolean' || typeof value.motion !== 'boolean') {
      throw Error('O‘yin progressi fayli yaroqsiz.');
    }
    const landscape = value.version >= 2 ? FarmWorld.parse(value.landscape) : FarmWorld.empty();
    const inventory = {};
    for (const [kind, count] of Object.entries(value.inventory)) {
      if (!Object.hasOwn(FarmData.items, kind) || !safeInt(count)) throw Error('Ombor ma’lumoti yaroqsiz.');
      inventory[kind] = count;
    }
    const orderReady = {};
    for (const [id, ready] of Object.entries(value.orderReady)) {
      if (!FarmData.orders.some(order => order.id === id) || !safeInt(ready)) throw Error('Buyurtma ma’lumoti yaroqsiz.');
      orderReady[id] = ready;
    }
    const ids = new Set();
    const cells = new Set();
    const presentKinds = new Set();
    const objects = value.objects.map(o => {
      if (!FarmWorld.record(o) || !positive(o.id) || o.id >= value.nextId || ids.has(o.id) ||
          !Object.hasOwn(FarmWorld.kinds, o.kind) || !FarmWorld.open(landscape, value.zones, o.x, o.y) ||
          cells.has(FarmWorld.key(o.x, o.y)) || FarmWorld.ground(landscape, o.x, o.y) === 'water') {
        throw Error('Saqlangan obyekt joylashuvi yaroqsiz.');
      }
      ids.add(o.id);
      cells.add(FarmWorld.key(o.x, o.y));
      presentKinds.add(o.kind);
      const clean = { id: o.id, kind: o.kind, x: o.x, y: o.y };
      if (FarmData.caps[o.kind]) {
        clean.rank = o.rank ?? 1;
        if (!positive(clean.rank) || clean.rank > FarmData.caps[o.kind]) throw Error('Bino darajasi xato.');
      }
      if (o.kind === 'field' && o.crop !== undefined) {
        if (!Object.hasOwn(FarmData.crops, o.crop) || !safeInt(o.started) || !positive(o.ready) || o.ready <= o.started) {
          throw Error('Ekin taymeri yaroqsiz.');
        }
        Object.assign(clean, { crop: o.crop, started: o.started, ready: o.ready });
      } else if (o.ready !== undefined) {
        if (!FarmData.buildings[o.kind]?.output || !positive(o.ready)) throw Error('Ishlab chiqarish taymeri yaroqsiz.');
        clean.ready = o.ready;
        if(o.batch!==undefined) {
          if(!positive(o.batch)||o.batch>10000)throw Error('Mahsulot miqdori xato.');
          clean.batch=o.batch;
        }
      }
      return clean;
    });
    if (![...FarmWorld.essential, 'field'].every(kind => presentKinds.has(kind))) throw Error('Fermaning zarur obyektlari yetishmaydi.');
    const c = value.camera;
    const camera = c && [c.x, c.y, c.zoom].every(Number.isFinite) && c.zoom >= .68 && c.zoom <= 2.45 ?
      { x: c.x, y: c.y, zoom: c.zoom } : { x: -12, y: 229, zoom: 1 };
    const skins = value.skins ?? [0], skin = value.skin ?? 0;
    if (!Array.isArray(skins) || !skins.includes(0) || !skins.includes(skin) ||
        skins.some(n => !Number.isInteger(n) || n < 0 || n > 3)) throw Error('Fermer kiyimi xato.');
    const farmer = value.farmer || {x:6,y:7};
    if (!FarmWorld.inBounds(farmer.x,farmer.y)) throw Error('Fermer joyi xato.');
    const published=value.published?FarmWorld.parse(value.published):null;
    return { version: 3, published, skins:[...new Set(skins)], skin, farmer:{x:farmer.x,y:farmer.y}, coins: value.coins, xp: value.xp, inventory, objects,
      nextId: value.nextId, zones: [...value.zones], orderReady, lesson: value.lesson,
      sound: value.sound, motion: value.motion, lowQuality: value.lowQuality === true, landscape, camera };
  }

  function create(storage) {
    let previousRaw = null;
    let primaryRaw;
    let recovered = false;
    let problem = false;
    function load() {
      for (const key of [KEY, PREVIOUS]) {
        try {
          const raw = storage?.getItem(key);
          if (key === KEY) primaryRaw = raw;
          if (!raw) continue;
          const state = parse(JSON.parse(raw));
          previousRaw = raw;
          recovered = key === PREVIOUS;
          return state;
        } catch { problem = true; }
      }
      return null;
    }
    function write(state) {
      if (!storage) return false;
      try {
        const raw = JSON.stringify(state);
        if (storage.getItem(KEY) !== primaryRaw) return false;
        if (raw === previousRaw && !recovered) return true;
        if (previousRaw !== null) {
          try { storage.setItem(PREVIOUS, previousRaw); } catch { /* Primary may still fit. */ }
        }
        storage.setItem(KEY, raw);
        previousRaw = primaryRaw = raw;
        recovered = false;
        return true;
      } catch { return false; }
    }
    const state = load();
    return { state, write, recovered, damaged: !state && problem };
  }
  return { parse, create };
})();

'use strict';

const FarmModel = (() => {
  const data = FarmData;
  
  const LEVELS = [0, 18, 58, 115, 200, 310, 465, 660, 900, 1200];
  const clone = obj => JSON.parse(JSON.stringify(obj));
  function fresh() {
    return {
      version: 3, published:null, skins:[0], skin:0, farmer:{x:6,y:7}, coins: 85, xp: 0, inventory: { wheat: 6, feed: 2 },
      objects: data.initialObjects.map((o, i) => ({ ...o, id: i + 1 })),
      nextId: data.initialObjects.length + 1, zones: [true, false, false],
      orderReady: {}, lesson: 0, sound: true, motion: true, lowQuality: false,
      landscape: FarmWorld.empty(), camera: { x: -12, y: 229, zoom: 1 }
    };
  }

  function create(storage, clock = Date.now) {
    const store = FarmSave.create(storage);
    const state = store.state || fresh();
    let pendingSave = Boolean(store.state && (store.recovered));
    let saved = !store.damaged;

    const houseRank = () => state.objects.find(o => o.kind === 'house')?.rank || 1;
    const capacity = () => 80 + 25 * ((state.objects.find(o => o.kind === 'barn')?.rank || 1) - 1);
    const skinPrices = [0,80,180,350];
    function dress(n) {
      if (!Number.isInteger(n) || !(n in skinPrices)) return fail('Kiyim topilmadi.');
      if (!state.skins.includes(n)) {
        if (state.coins < skinPrices[n]) return fail('Tanga yetarli emas.');
        state.coins -= skinPrices[n]; state.skins.push(n);
      }
      state.skin = n;
      return commit('Fermer kiyimi tanlandi.');
    }
    function walkTo(x,y) {
      if (!FarmWorld.open(state.landscape,state.zones,x,y) || at(x,y) || FarmWorld.ground(state.landscape,x,y)==='water') return;
      state.farmer = {x,y}; pendingSave = true; save();
    }
    function quote(o) {
      const next = (o.rank || 1) + 1;
      const gate = Math.min(10,next);
      const cost = next * (FarmData.upgradePrices?.[o.kind] || (o.kind==='house' ? 45 : 24));
      return {next,gate,cost,allowed:next <= data.caps[o.kind] && state.coins >= cost &&
        (o.kind==='house' ? level() : houseRank()) >= gate};
    }
    function upgrade(id) {
      const o=object(id);
      if (!o || !data.caps[o.kind]) return fail('Bino topilmadi.');
      const q=quote(o);
      if (!q.allowed) return fail('Daraja yoki tanga yetarli emas.');
      if (o.kind==='house') {
        const need=Math.max(0,data.plots[q.next-1]-state.objects.filter(o=>o.kind==='field').length);
        const slots=[];
        const candidates=[];
        for(let y=2;y<=FarmWorld.max;y++) for(let x=2;x<=FarmWorld.max;x++)
          candidates.push({x,y,d:(x-4)**2+(y-5)**2});
        candidates.sort((a,b)=>a.d-b.d || a.y-b.y || a.x-b.x);
        for(const {x,y} of candidates) {
          if(slots.length>=need)break;
          if ((state.farmer.x===x && state.farmer.y===y) || at(x,y) || FarmWorld.ground(state.landscape,x,y)!=='grass') continue;
          slots.push({x,y});
        }
        if(slots.length<need) return fail('Bo‘sh yer yetarli emas.');
        for(const pos of slots) {
          const cell=FarmWorld.key(pos.x,pos.y);
          if(!FarmWorld.open(state.landscape,state.zones,pos.x,pos.y)) state.landscape.areas.push(cell);
          state.objects.push({...pos,kind:'field',id:state.nextId++});
        }
        const edge=8+q.next*2;
        const opened=new Set(state.landscape.areas);
        for(let y=4;y<=edge;y++) for(let x=4;x<=edge;x++){
          const cell=FarmWorld.key(x,y);
          if(!state.zones[data.zone(x,y)] && !opened.has(cell) && FarmWorld.wild(x,y)!=='water')
            state.landscape.areas.push(cell);
        }
      }
      state.coins -= q.cost; o.rank=q.next;
      return commit('Bino '+q.next+'-darajaga ko‘tarildi.');
    }
    function level() {
      return LEVELS.filter(threshold => state.xp >= threshold).length;
    }
    const quantity = name => state.inventory[name] || 0;
    const used = () => Object.values(state.inventory).reduce((sum, count) => sum + count, 0);
    const has = recipe => Object.entries(recipe).every(([key, count]) => quantity(key) >= count);
    const object = id => state.objects.find(o => o.id === id);
    const at = (x, y) => state.objects.find(o => o.x === x && o.y === y);
    const isFree = (x, y) => !(state.farmer.x===x && state.farmer.y===y) && FarmWorld.buildable(state.landscape, state.zones, x, y) && !at(x, y);
    function change(recipe, sign) {
      for (const [key, count] of Object.entries(recipe)) state.inventory[key] = quantity(key) + count * sign;
    }
    function save() {
      if (pendingSave) {
        saved = store.write(state);
        pendingSave = !saved;
      }
      return saved;
    }
    function commit(message, xp = 0) {
      const before = level();
      state.xp += xp;
      pendingSave = true;
      return { ok: true, saved: save(), message, raised: level() > before };
    }
    const fail = message => ({ ok: false, message });
    function plant(id, key) {
      const plot = object(id);
      const crop = data.crops[key];
      if (!plot || plot.kind !== 'field' || plot.crop || !crop) return fail('Ekish uchun bo‘sh dala kerak.');
      if (level() < crop.level) return fail('Bu ekin hali ochilmagan.');
      if (!quantity(key)) return fail('Urug‘ qolmadi. Do‘kondan olishingiz mumkin.');
      const now = clock();
      change({ [key]: 1 }, -1);
      plot.crop = key;
      plot.started = now;
      plot.ready = now + crop.duration * 1000;
      if (state.lesson === 0) state.lesson = 1;
      return commit(crop.name + ' ekildi.');
    }
    function harvest(id) {
      const plot = object(id);
      if (plot?.kind !== 'field' || !plot.crop || clock() < plot.ready) return fail('Hosil hali pishmagan.');
      if (used() + 3 > capacity()) return fail('Omborda 3 ta bo‘sh joy kerak.');
      const key = plot.crop;
      change({ [key]: 3 }, 1);
      delete plot.crop;
      delete plot.started;
      delete plot.ready;
      if (state.lesson <= 1) state.lesson = 2;
      return commit(data.items[key].name + ' +3  ·  XP +3', 3);
    }
    function produce(id) {
      const building = object(id);
      const recipe = data.buildings[building?.kind];
      if (!recipe?.output || building.ready) return fail('Bu yerda ishlab chiqarish band.');
      if (!has(recipe.recipe)) return fail('Kerakli masalliq omborda yetarli emas.');
      change(recipe.recipe, -1);
      building.batch=recipe.count;
      building.ready = clock() + Math.round(recipe.duration * 1000 / (1 + .1*((building.rank || 1)-1)));
      return commit(recipe.name + ' ishga tushdi.');
    }
    function collect(id) {
      const building = object(id);
      const recipe = data.buildings[building?.kind];
      if (!recipe?.output || !building.ready || clock() < building.ready) return fail('Mahsulot hali tayyor emas.');
      const count=building.batch || recipe.count;
      if (used() + count > capacity()) return fail('Omborda joy yetarli emas.');
      change({ [recipe.output]: count }, 1);
      delete building.ready; delete building.batch;
      return commit(data.items[recipe.output].name + ' +' + count + '  ·  XP +5', 5);
    }
    function fulfill(id) {
      const order = data.orders.find(entry => entry.id === id);
      if (!order || level() < order.level || (state.orderReady[id] || 0) > clock()) return fail('Buyurtma hali ochilmagan.');
      if (!has(order.need)) return fail('Buyurtma uchun mahsulot yetarli emas.');
      change(order.need, -1);
      state.coins += order.coins;
      state.orderReady[id] = clock() + 45000;
      if (state.lesson === 2) state.lesson = 3;
      return commit('+' + order.coins + ' tanga  ·  XP +' + order.xp, order.xp);
    }
    function sell(key) {
      if (!Object.hasOwn(data.items, key) || !quantity(key)) return fail('Mahsulot qolmadi.');
      change({ [key]: 1 }, -1);
      state.coins += data.items[key].sale;
      return commit('+' + data.items[key].sale + ' tanga');
    }
    function seedPrice(key) {
      const sale = data.crops[key].sale;
      if (key === 'wheat' && state.coins < sale && !quantity(key) &&
          !state.objects.some(o => o.crop === key)) return 0;
      return sale;
    }
    function buySeed(key) {
      if (!Object.hasOwn(data.crops, key) || level() < data.crops[key].level) return fail('Bu urug‘ hali ochilmagan.');
      const price = seedPrice(key);
      if (state.coins < price) return fail('Tanga yetarli emas.');
      if (used() >= capacity()) return fail('Omborda joy qolmadi.');
      state.coins -= price;
      change({ [key]: 1 }, 1);
      return commit(data.crops[key].name + ' urug‘i olindi.');
    }
    function build(kind, x, y) {
      if (!Object.hasOwn(data.buildings, kind)) return fail('Bu buyum do‘konda yo‘q.');
      const entry = data.buildings[kind];
      if(kind==='field' && state.objects.filter(o=>o.kind==='field').length >= data.plots[houseRank()-1]) return fail('Ko‘proq dala uchun fermer uyini yaxshilang.');
      if (level() < entry.level || state.coins < entry.price) return fail('Daraja yoki tanga yetarli emas.');
      if (!isFree(x, y)) return fail('Belgilanadigan bo‘sh yerga bosing.');
      state.coins -= entry.price;
      state.objects.push({ id: state.nextId++, kind, x, y });
      if (state.lesson === 3) state.lesson = 4;
      return commit(entry.name + ' joylashtirildi.');
    }
    function move(id, x, y) {
      const entry = object(id);
      if (!entry || !Object.hasOwn(data.buildings, entry.kind) || !isFree(x, y)) return fail('Bo‘sh yerga bosing.');
      entry.x = x;
      entry.y = y;
      return commit('Joy o‘zgartirildi.');
    }
    function expand(index) {
      const entry = data.expansions[index];
      if (!entry || state.zones[index + 1] || level() < entry.level || state.coins < entry.price) {
        return fail('Hudud hali ochilmagan yoki tanga yetarli emas.');
      }
      state.coins -= entry.price;
      state.zones[index + 1] = true;
      return commit(entry.name + ' ochildi.', 6);
    }
    function setting(key, value) {
      if (!['sound', 'motion', 'lesson', 'lowQuality'].includes(key)) return fail('Bunday sozlama yo‘q.');
      state[key] = value;
      return commit('');
    }
    function setCamera(x, y, zoom) {
      const previous = state.camera;
      if (previous.x === x && previous.y === y && previous.zoom === zoom) return saved;
      state.camera = { x, y, zoom };
      pendingSave = true;
      return save();
    }
    function restore(backup) {
      try {
        const next = FarmSave.parse(backup);
        if (!store.write(next)) return fail('Zaxirani brauzerda saqlab bo‘lmadi.');
        Object.assign(state, next);
        saved = true;
        pendingSave = false;
        return { ok: true, saved: true, message: 'O‘yin zaxiradan tiklandi.' };
      } catch (error) { return fail(error.message); }
    }
    function applyDraft(input) {
      try {
        const map = FarmWorld.checkDraft(FarmWorld.parseDraft(input), state);
        let nextId = state.nextId;
        const objects = map.objects.map(o => {
          const old = o.id > 0 ? object(o.id) : null;
          return old ? { ...old, x: o.x, y: o.y } : { ...o, id: nextId++ };
        });
        const next = { ...state, nextId, objects, landscape: map.landscape };
        if (!store.write(next)) return fail('Xarita va progressni brauzerda saqlab bo‘lmadi.');
        Object.assign(state, next);
        saved = true;
        pendingSave = false;
        return { ok: true, saved: true, message: 'Xarita shu fermaga qo‘llandi.' };
      } catch (error) { return fail(error.message); }
    }
    function syncWorld(map) {
      try {
        const land=FarmWorld.parse(map.landscape);
        const next=clone(state);
        if(!store.state){
          next.objects=map.objects.map(o=>({...o}));
          next.nextId=Math.max(...next.objects.map(o=>o.id))+1;
          next.landscape=land;next.zones=[...map.zones];
        }else {
          // Personal objects and explicit local terrain take precedence on existing farms.
          const previous=state.published || FarmWorld.empty();
          for(const k of new Set([...Object.keys(previous.tiles),...Object.keys(land.tiles)])){
            const t=land.tiles[k];
            const [x,y]=k.split(',').map(Number);
            if(at(x,y) || next.landscape.tiles[k]!==previous.tiles[k])continue;
            if(t)next.landscape.tiles[k]=t;
            else delete next.landscape.tiles[k];
          }
          next.landscape.areas=[...new Set([...next.landscape.areas,...land.areas])];
        }
        next.published=land;
        const valid=FarmSave.parse(next);
        if(JSON.stringify(next)!==JSON.stringify(state) && store.write(valid))Object.assign(state,valid);
      }catch{/* Ignore a map incompatible with this save. */}
    }
    const snapshot = () => clone(state);
    const read = () => state;
    return {
      read, snapshot, syncWorld, save, setCamera, restore, applyDraft, store, level, quantity, used, has, object, at, isFree,
      plant, harvest, produce, collect, fulfill, sell, seedPrice, buySeed, build, move, expand, setting,
      levels: LEVELS, quote, upgrade, dress, skinPrices, walkTo, get capacity() { return capacity(); }
    };
  }
  return { create };
})();

'use strict';
const FarmProfiles=(()=>{
  const current=()=>localStorage.getItem('farm-profile')||'';
  function store(){
    const id=current();
    if(!id)return localStorage;
    return {getItem:k=>localStorage.getItem('fv:'+id+':'+k),setItem:(k,v)=>localStorage.setItem('fv:'+id+':'+k,v)};
  }
  function choose(){
    const name=prompt('Ferma profilining nomi (asosiy ferma uchun bo‘sh qoldiring):',current());
    if(name===null)return;
    if(name.trim().length>40){alert('Nom 40 belgidan oshmasin.');return;}
    localStorage.setItem('farm-profile',name.trim());location.reload();
  }
  return {store,choose,current};
})();

'use strict';
const FarmTraveler = (() => {
  function create(model) {
    const state=model.read();
    let steps=[], origin={...state.farmer}, started=0, tending=0, task=null;
    const walkable=(x,y)=> FarmWorld.open(state.landscape,state.zones,x,y) &&
      FarmWorld.ground(state.landscape,x,y)!=='water' && !model.at(x,y);
    function settle(){
      if(walkable(state.farmer.x,state.farmer.y))return;
      let nearest=null,dist=Infinity;
      for(let y=0;y<=FarmWorld.max;y++)for(let x=0;x<=FarmWorld.max;x++){
        const d=Math.abs(x-state.farmer.x)+Math.abs(y-state.farmer.y);
        if(d<dist&&walkable(x,y)){nearest={x,y};dist=d;}
      }
      if(nearest){steps=[];origin=nearest;model.walkTo(nearest.x,nearest.y);}
    }
    function route(dest, near=false,work=null) {
      settle();
      const start=state.farmer;
      const queue=[start], parent=new Map([[FarmWorld.key(start.x,start.y),null]]);
      for(let i=0;i<queue.length;i++) {
        const p=queue[i];
        if(Math.abs(p.x-dest.x)+Math.abs(p.y-dest.y)===(near?1:0)) {
          const path=[];
          for(let v=p; v!==start; v=parent.get(FarmWorld.key(v.x,v.y))) path.push(v);
          steps=path.reverse(); origin={...start}; started=Date.now();
          task=work; tending=work?started+steps.length*230+850:0;
          return true;
        }
        for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]) {
          const x=p.x+dx,y=p.y+dy,k=FarmWorld.key(x,y);
          if(!parent.has(k)&&walkable(x,y)) {parent.set(k,p);queue.push({x,y});}
        }
      }
      return false;
    }
    function position(now) {
      settle();
      while(steps.length && now-started>=230) {
        const p=steps.shift();
        if(!walkable(p.x,p.y)){steps=[];break;}
        model.walkTo(p.x,p.y); origin=p; started+=230;
      }
      if(!steps.length) return {...state.farmer,bob:now<tending?Math.sin(now/95)*2:0,task:now<tending?task:null};
      const t=Math.min(1,Math.max(0,(now-started)/230)),p=steps[0];
      return {x:origin.x+(p.x-origin.x)*t,y:origin.y+(p.y-origin.y)*t,bob:Math.abs(Math.sin(t*Math.PI))*2};
    }
    return {route,position};
  }
  return {create};
})();

'use strict';
const Village = (() => {
  const atlas=new Image(), tower=new Image();
  atlas.src='/assets/village.webp'; tower.src='/assets/tower.webp';
  const lake=new Image();
  lake.src='/assets/lakeside.webp';
  let painting;
  function shore(c,v,w){
    const pos={x:0,y:-130};
    const left=pos.x-750,top=pos.y-140;
    if(w.x<left || v.x>left+1500 || w.y<top || v.y>top+235 || !lake.complete || !lake.naturalWidth)return;
    if(!painting){
      painting=document.createElement('canvas');
      painting.width=900;painting.height=450;
      const brush=painting.getContext('2d');
      brush.drawImage(lake,0,0,lake.naturalWidth,lake.naturalHeight*.27,0,0,900,450);
      brush.globalCompositeOperation='destination-in';
      for(const vertical of [false,true]){
        const mask=brush.createLinearGradient(0,0,vertical?0:900,vertical?450:0);
        mask.addColorStop(0,'transparent');mask.addColorStop(.15,'black');mask.addColorStop(.84,'black');mask.addColorStop(1,'transparent');
        brush.fillStyle=mask;brush.fillRect(0,0,900,450);
      }
    }
    c.drawImage(painting,left,top,1500,235);
  }
  function sprite(c,row,col,x,y,w,h) {
    if(!atlas.complete || !atlas.naturalWidth) return false;
    c.drawImage(atlas,col*104,row*112,104,112,x-w/2,y-h,w,h);
    return true;
  }
  function building(c,o) {
    const rank=o.rank||1;
    if(o.kind==='barn' && rank===11 && tower.complete && tower.naturalWidth) {
      c.drawImage(tower,-45,-97,90,102); return true;
    }
    const row={house:0,barn:1,bakery:2}[o.kind];
    if(row===undefined) return false;
    const size=(o.kind==='barn'?76:87)+rank*1.25;
    const ok=sprite(c,row,rank-1,0,9,size,size);
    if(ok && o.kind==='house' && rank===8) {
      FarmArt.oval(c,-26,1,7,4,'#70b9bc');
      FarmArt.line(c,[[-26,1],[-26,-6]],'#d7f1de',2);
    }
    return ok;
  }
  function outskirts(c,v,w,land,occupied) {
    const corners=[[v.x,v.y],[v.x,w.y],[w.x,v.y],[w.x,w.y]].map(([x,y])=>FarmArt.inverse(x,y));
    const xs=corners.map(p=>p.x),ys=corners.map(p=>p.y);
    for(let y=Math.max(0,Math.min(...ys)-2);y<=Math.min(47,Math.max(...ys)+2);y++)
      for(let x=Math.max(0,Math.min(...xs)-2);x<=Math.min(47,Math.max(...xs)+2);x++){
        if(x<18&&y<18)continue;
        const p=FarmArt.project(x,y);
        if(p.x<v.x-50||p.x>w.x+50||p.y<v.y-30||p.y>w.y+70)continue;
        c.save();c.translate(p.x,p.y);
        const lake=FarmWorld.wild(x,y)==='water';
        FarmArt.tile(c,lake?'#6dbabb':['#91ad58','#8cab55','#8baa56'][(x*17+y*13)%3],1.016);
        if(lake && !land.tiles[FarmWorld.key(x,y)]) {
          if(FarmWorld.wild(x+1,y)!=='water'||FarmWorld.wild(x,y+1)!=='water'){
            for(let i=0;i<5;i++){
              const bx=i*3-6;
              FarmArt.line(c,[[bx,5],[bx-3,0],[bx-4,-7-i%3*2]],'#708542',1.4);
            }
          }
          if(x===28 && y===19){
            FarmArt.oval(c,0,0,23,8,'#497f7d',-.3);
            FarmArt.oval(c,0,-3,22,7,'#80573a',-.3);
            FarmArt.oval(c,0,-4,18,4,'#bc9160',-.3);
            FarmArt.line(c,[[-8,-9],[9,3]],'#e3c08d',2.4);
          }
        }
        if(lake && (x+y)%4===0) FarmArt.line(c,[[-10,0],[5,-1],[16,0]],'#a7dbcc',1);
        if(!lake && !occupied.has(FarmWorld.key(x,y)) && !land.tiles[FarmWorld.key(x,y)] && (x*31+y*29)%13===1){
          FarmArt.tree(c,.55+(x%4)*.08,(x+y)%3,false);
        }
        c.restore();
      }
  }
  return {sprite,building,outskirts,shore};
})();

'use strict';

const FarmEditor = (() => {
  const STORAGE_KEY = 'farm-valley-editor-v1';
  const LIMIT = 8;
  const world = FarmWorld;
  const copy = world.clone;
  const tools = [
    ['pan', 'Surish'], ['select', 'Tanlash'], ['grass', 'O‘t'], ['road', 'Yo‘l'],
    ['water', 'Suv'], ['tree', 'Daraxt'], ['rock', 'Tosh'], ['building', 'Bino'],
    ['decor', 'Bezak'], ['area', 'Hudud'], ['erase', 'O‘chirgich']
  ];
  const names = Object.fromEntries(tools);
  const decorations = ['flowers', 'tree', 'rock', 'fence'];
  const buildings = Object.keys(FarmData.buildings).filter(kind => !decorations.includes(kind));
  const escape = value => String(value).replace(/[&<>"']/g, char =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[char]);

  function create(storage, state) {
    let data = { active: null, drafts: [] };
    let loadError = false;
    try {
      const raw = storage?.getItem(STORAGE_KEY);
      if (raw) {
        const value = JSON.parse(raw);
        if (!Array.isArray(value.drafts)) throw Error('Qoralamalar buzilgan.');
        data = { active: value.active && world.parseDraft(value.active), drafts: value.drafts.slice(0, LIMIT).map(entry => {
          if (typeof entry.name !== 'string' || !entry.name.trim() || entry.name.length > 48) throw Error('Qoralama nomi xato.');
          return { name: entry.name, map: world.parseDraft(entry.map) };
        }) };
      }
    } catch { loadError = true; }

    let map = data.active || world.draft(state);
    let before = null;
    let previous = [];
    let future = [];
    let tool = 'pan';
    let building = 'field';
    let decor = 'flowers';
    let selected = null;
    let moving = false;

    function save() {
      if (!storage) return false;
      try {
        storage.setItem(STORAGE_KEY, JSON.stringify(data));
        return true;
      } catch { return false; }
    }
    function finish() {
      if (!before) return null;
      const old = before;
      before = null;
      if (JSON.stringify(old) === JSON.stringify(map)) { map = old; return null; }
      previous.push(old);
      if (previous.length > 35) previous.shift();
      future = [];
      data.active = map;
      return save();
    }
    function begin() {
      if (!before) {
        before = map;
        map = copy(map);
      }
    }
    function cancel() {
      if (before) map = before;
      before = null;
    }
    function history(from, to) {
      if (!from.length) return null;
      to.push(map);
      map = from.pop();
      data.active = map;
      selected = null;
      moving = false;
      return save();
    }
    function replace(next, persistActive = true) {
      map = next;
      before = null;
      data.active = persistActive ? map : null;
      previous = [];
      future = [];
      selected = null;
      moving = false;
      return save();
    }
    function start() {
      if (!data.active) map = world.draft(state);
    }
    function draftSave(name) {
      name = name.trim();
      if (!name || name.length > 48) return 'Qoralamaga 1–48 belgidan iborat nom kiriting.';
      if (!data.drafts.some(entry => entry.name === name) && data.drafts.length === LIMIT) return '8 ta qoralama saqlangan. Avval bittasini o‘chiring.';
      const drafts = data.drafts;
      data.drafts = [{ name, map: copy(map) }, ...drafts.filter(entry => entry.name !== name)];
      data.active = map;
      if (save()) return '';
      data.drafts = drafts;
      return 'Qoralamani brauzerda saqlab bo‘lmadi.';
    }
    function draftDelete(index) {
      const drafts = data.drafts;
      data.drafts = drafts.filter((_, i) => i !== index);
      if (save()) return true;
      data.drafts = drafts;
      return false;
    }
    function choose(next) {
      if (!Object.hasOwn(names, next)) return;
      tool = next;
      moving = false;
      if (tool !== 'select') selected = null;
    }
    function variant(kind) {
      if (tool === 'building' && buildings.includes(kind)) building = kind;
      if (tool === 'decor' && decorations.includes(kind)) decor = kind;
    }
    const brush = () => !['pan', 'select'].includes(tool);
    const target = () => map.objects.find(o => o.id === selected);
    const at = (x, y) => map.objects.find(o => o.x === x && o.y === y);

    function remove(o) {
      const live = state.objects.find(entry => entry.id === o.id);
      if (world.essential.has(o.kind) || live?.ready || live?.crop ||
          o.kind === 'field' && map.objects.filter(entry => entry.kind === 'field').length <= 1) {
        return 'Zarur obyektni yoki band dala/binoni o‘chirib bo‘lmaydi.';
      }
      map.objects = map.objects.filter(entry => entry.id !== o.id);
      if (selected === o.id) selected = null;
      return '';
    }

    function edit(x, y) {
      if (tool === 'pan') return '';
      if (!world.inBounds(x, y)) return 'Xarita chegarasi.';
      const object = at(x, y);
      const cell = world.key(x, y);
      const land = map.landscape;
      if (tool === 'select') {
        if (!moving) {
          selected = object?.id ?? null;
          return '';
        }
        if (object?.id === selected) { moving = false; return ''; }
        if (object || !world.buildable(land, state.zones, x, y)) return 'Ko‘chirish uchun ochiq, bo‘sh o‘tli katak kerak.';
        const row = target();
        if (row) Object.assign(row, { x, y });
        moving = false;
        return '';
      }
      if (tool === 'erase') {
        if (object) return remove(object);
        if (Object.hasOwn(land.tiles, cell)) delete land.tiles[cell];
        else if (land.areas.includes(cell)) land.areas = land.areas.filter(area => area !== cell);
        else if (FarmData.path(x, y)) land.tiles[cell] = 'grass';
        return '';
      }
      if (tool === 'area') {
        if (!land.areas.includes(cell)) land.areas.push(cell);
        return '';
      }
      if (['grass', 'road', 'water'].includes(tool)) {
        if (object && tool !== 'grass') return 'Avval bu katakdagi obyektni ko‘chiring.';
        land.tiles[cell] = tool;
        return '';
      }
      if (object) return 'Bu katak band.';
      if (!world.buildable(land, state.zones, x, y)) return 'Ochiq o‘tli katak kerak. Yer ochish uchun Hudud vositasidan foydalaning.';
      const kind = tool === 'building' ? building : tool === 'decor' ? decor : tool;
      const id = Math.min(0, ...map.objects.map(o => o.id)) - 1;
      map.objects.push({ id, kind, x, y });
      return '';
    }

    function toolbar() {
      const options = tool === 'building' ? buildings : tool === 'decor' ? decorations : [];
      const variantKey = tool === 'building' ? building : decor;
      const object = target();
      const hint = moving ? 'Yangi ochiq katakni bosing' : object ?
        world.kinds[object.kind] + ' · ' + (object.x + 1) + ', ' + (object.y + 1) :
        tool === 'pan' ? 'Xaritani bir barmoq bilan suring' : tool === 'select' ?
          'Obyekt katagini bosing' : 'Katakka bosing yoki barmoqni torting';
      return '<div class="editor-status"><span>' + hint + '</span>' + (object ?
        '<button data-editor="move">Ko‘chirish</button><button data-editor="remove">O‘chirish</button>' : '') + '</div>' +
        (options.length ? '<label class="editor-variant">' + names[tool] + '<select aria-label="Obyekt turi">' +
          options.map(kind => '<option value="' + kind + '"' + (kind === variantKey ? ' selected' : '') + '>' +
            world.kinds[kind] + '</option>').join('') + '</select></label>' : '') +
        '<div class="editor-tools" aria-label="Xarita vositalari">' + tools.map(([key, title]) =>
          '<button data-tool="' + key + '" aria-pressed="' + (key === tool) + '">' + title + '</button>').join('') + '</div>' +
        '<div class="editor-actions" aria-label="Xarita amallari">' +
          '<button data-editor="undo"' + (previous.length ? '' : ' disabled') + '>Qaytarish</button>' +
          '<button data-editor="redo"' + (future.length ? '' : ' disabled') + '>Tiklash</button>' +
          '<button data-editor="preview">Ko‘rib chiqish</button><button data-editor="drafts">Qoralamalar</button>' +
          '<button data-editor="apply" class="primary">Fermaga qo‘llash</button></div>';
    }

    return { read: () => map, start, begin, finish, cancel, edit, choose, variant, brush, target, toolbar,
      tool: () => tool, active: () => Boolean(data.active), loadError,
      undo: () => history(previous, future), redo: () => history(future, previous),
      moving: () => { moving = Boolean(target()); }, isMoving: () => moving,
      remove: () => target() ? remove(target()) : '',
      reset: () => replace(world.draft(state)), clearWorking: () => replace(world.draft(state), false),
      import: value => replace(world.parseDraft(value)),
      draftSave, draftDelete,
      draftLoad: index => data.drafts[index] ? replace(copy(data.drafts[index].map)) : null,
      drafts: () => data.drafts.map(({ name }) => escape(name))
    };
  }
  return { create };
})();

'use strict';

const FarmArt = (() => {
  const TX = 45;
  const TY = 24;
  const project = (x, y) => ({ x: (x - y) * TX, y: (x + y) * TY });
  const inverse = (x, y) => ({
    x: Math.round((x / TX + y / TY) / 2),
    y: Math.round((y / TY - x / TX) / 2)
  });
  const palettes = {
    wheat: ['#e3a436', '#f7ca5d'], corn: ['#508638', '#f0bc47'], carrot: ['#548936', '#ee8646'],
    pumpkin: ['#507c38', '#de873c']
  };
  function random(seed) {
    let n = seed;
    return () => {
      n = (Math.imul(n, 1664525) + 1013904223) >>> 0;
      return n / 4294967296;
    };
  }
  function polygon(c, points, fill, stroke) {
    c.beginPath();
    c.moveTo(...points[0]);
    for (const p of points.slice(1)) c.lineTo(...p);
    c.closePath();
    c.fillStyle = fill;
    c.fill();
    if (stroke) {
      c.strokeStyle = stroke;
      c.lineWidth = 1;
      c.stroke();
    }
  }
  function line(c, points, color, width = 1) {
    c.beginPath();
    c.moveTo(...points[0]);
    for (const p of points.slice(1)) c.lineTo(...p);
    c.strokeStyle = color;
    c.lineWidth = width;
    c.lineCap = 'round';
    c.lineJoin = 'round';
    c.stroke();
  }
  function oval(c, x, y, rx, ry, color, rotation = 0) {
    c.beginPath();
    c.ellipse(x, y, rx, ry, rotation, 0, Math.PI * 2);
    c.fillStyle = color;
    c.fill();
  }
  function gradient(c, y, height, a, b) {
    const g = c.createLinearGradient(0, y, 0, y + height);
    g.addColorStop(0, a);
    g.addColorStop(1, b);
    return g;
  }
  function tile(c, fill, size = 1, outline) {
    polygon(c, [[0, -TY * size], [TX * size, 0], [0, TY * size], [-TX * size, 0]], fill, outline);
  }
  function grass(c, x, y, h, color) {
    line(c, [[x - 3, y - h + 2], [x, y], [x + 3, y - h]], color, 1.2);
  }
  function flower(c, x, y, color, size = 1) {
    line(c, [[x, y + 4 * size], [x + size, y - 3 * size]], '#52814e', size);
    for (let i = 0; i < 5; i++) {
      const a = i * Math.PI * 2 / 5;
      oval(c, x + Math.cos(a) * 2 * size, y - 3 * size + Math.sin(a) * 2 * size,
        1.65 * size, 1.55 * size, color);
    }
    oval(c, x, y - 3 * size, size, size, '#f8d76e');
  }
  function tree(c, size = 1, variant = 0, fruit = false) {
    c.save();
    c.scale(size, size);
    oval(c, 5, 1, 26, 10, '#36543842', -.12);
    line(c, [[0, 1], [1, -27], [-5, -39]], '#704e34', 8);

  function shape(c, edges, margin, radius) {
    const [left, top, right, bottom] = edges.map(join => join ? .506 : .5 - margin);
    const vertices = [[-left, -top], [right, -top], [right, bottom], [-left, bottom]];
    const joins = [[edges[0], edges[1]], [edges[1], edges[2]], [edges[2], edges[3]], [edges[3], edges[0]]];
    const towards = (from, to, distance) => {
      const gap = Math.hypot(to[0] - from[0], to[1] - from[1]);
      return project(from[0] + (to[0] - from[0]) * distance / gap,
        from[1] + (to[1] - from[1]) * distance / gap);
    };
    c.beginPath();
    vertices.forEach((corner, i) => {
      const bend = joins[i].some(Boolean) ? 0 : radius;
      const before = towards(corner, vertices[(i + 3) % 4], bend);
      const after = towards(corner, vertices[(i + 1) % 4], bend);
      const p = project(...corner);
      if (i === 0) c.moveTo(before.x, before.y);
      else c.lineTo(before.x, before.y);
      c.quadraticCurveTo(p.x, p.y, after.x, after.y);
    });
    c.closePath();
  }
  function landSprite(type, edges, variant) {
    const id = type + edges.map(Number).join('') + variant;
    if (landSprites.has(id)) return landSprites.get(id);
    const sprite = document.createElement('canvas');
    sprite.width = 96;
    sprite.height = 54;
    const c = sprite.getContext('2d');
    c.translate(48, 27);
    const rng = random(17 + variant * 23);
    if (type === 'grass') {
      tile(c, ['#8dab55', '#91ad58', '#88a752'][variant], 1.015);
      for (let n = 0; n < 7; n++) {
        const p = project((rng() - .5) * .85, (rng() - .5) * .85);
        grass(c, p.x, p.y, 3 + rng() * 2, '#62864787');
      }
    } else {
      const pond = type === 'water';
      const colors = pond ? ['#d7c28a', '#518e87', '#72bbb4'] : ['#ab985d', '#c0a574', '#d6b781'];
      const margins = pond ? [.015, .045, .078] : [.14, .17, .20];
      for (const [i, color] of colors.entries()) {
        shape(c, edges, margins[i], .12);
        c.fillStyle = color;
        c.fill();
      }
      c.save();
      c.clip();
      for (let n = 0; n < 5; n++) {
        const p = project((rng() - .5) * .65, (rng() - .5) * .65);
        if (pond) line(c, [[p.x - 5, p.y], [p.x + 2, p.y - 1], [p.x + 8, p.y - .2]], '#d0eee38e', .9);
        else oval(c, p.x, p.y, 1.8, .75, '#a9885a76');
      }
      c.restore();
    }
    landSprites.set(id, sprite);
    return sprite;
  }
  function drawLand(c, land, v, w) {

    for (const cell of edited) {
      const [x, y] = cell.split(',').map(Number);
      const type = FarmWorld.ground(land, x, y);
      if (!land.tiles[cell] && type === 'road') continue;
      const p = project(x, y);
      if (p.x < v.x - TX || p.x > w.x + TX || p.y < v.y - TY || p.y > w.y + TY) continue;
      const variant = (x * 11 + y * 7) % 3;
      c.drawImage(landSprite('grass', [], variant), p.x - 48, p.y - 27);
      if (type !== 'grass') cells.push({ x, y, p, type, variant });
    }
    for (const { x, y, p, type, variant } of cells) {
      const edges = directions.map(([dx, dy]) => FarmWorld.ground(land, x + dx, y + dy) === type);
      c.drawImage(landSprite(type, edges, variant), p.x - 48, p.y - 27);
    }
