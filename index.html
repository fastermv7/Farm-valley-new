<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#203d32">
<meta name="description" content="Ekin eking, hayvon boqing va vodiyda o‘z fermangizni quring.">
<title>Farm Valley</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
<script defer src="data.js"></script>
<script defer src="world.js"></script>
<script defer src="save.js"></script>
<script defer src="model.js"></script>
<script defer src="editor.js"></script>
<script defer src="art.js"></script>
<script defer src="game.js"></script>
</head>
<body>
<main id="game" aria-label="Farm Valley">
<canvas id="map" aria-label="Ferma xaritasi"></canvas>
<header class="hud">
  <div class="brand"><img src="icon.svg" alt=""><strong>Farm <em>Valley</em></strong></div>
  <div class="resources">
    <div class="level" id="level" aria-label="Daraja"></div>
    <div class="xp"><b id="xp"></b><div><i id="bar"></i></div></div>
    <div class="coin"><span class="gold"></span><b id="coins"></b></div>
  </div>
  <button id="settings" class="square" aria-label="Sozlamalar" title="Sozlamalar"></button>
</header>
<div id="lesson" class="lesson"></div>
<div id="buildHint" class="build-hint" hidden><span id="placementText"></span><button id="cancel">Bekor qilish</button></div>
<div id="notice" role="status"></div>
<div class="map-actions" aria-label="Xaritani boshqarish">
  <button id="plus" class="square" aria-label="Kattalashtirish">+</button>
  <button id="minus" class="square" aria-label="Kichraytirish">−</button>
  <button id="home" class="square" aria-label="Ferma markaziga qaytish"></button>
</div>
<nav class="dock" aria-label="Ferma menyusi">
  <button data-view="fields" data-icon="wheat">Dala</button>
  <button data-view="orders" data-icon="orders">Buyurtmalar</button>
  <button data-view="barn" data-icon="barn">Ombor</button>
  <button data-view="shop" data-icon="shop">Do‘kon</button>
</nav>
<div id="editorTop" class="editor-top" hidden>
  <button id="editorBack">Chiqish</button><strong>Xarita muharriri</strong>
</div>
<section id="editorBar" class="editor-bar" aria-label="Xarita muharriri" hidden></section>
<button id="previewBack" class="preview-back" hidden>Muharrirga qaytish</button>
<input id="jsonFile" type="file" accept=".json,application/json" hidden>
<aside id="panel" hidden aria-labelledby="panelTitle">
  <div class="panel-top"><h1 id="panelTitle"></h1><button id="close" class="square" aria-label="Yopish">×</button></div>
  <div id="panelBody" class="panel-body"></div>
</aside>
</main>
</body>
</html>
